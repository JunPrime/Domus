<div class="auth-container">
  <div class="auth-header">
    <i class="bi bi-house-fill"></i>
    <h1>Administración del Hogar</h1>
  </div>

  <div class="auth-card">
    <h2 class="auth-title">Crear Cuenta</h2>
    <p class="auth-subtitle">Ingresa tus datos para registrarte</p>

    <div class="error-message" *ngIf="error">
      {{ error }}
    </div>

    <form (ngSubmit)="register()">
      <div class="form-group">
        <label for="username">Usuario *</label>
        <input type="text" id="username" [(ngModel)]="username" name="username" placeholder="Nombre de usuario" />
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico *</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="tu@email.com" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña *</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Mínimo 6 caracteres" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar contraseña *</label>
        <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" />
      </div>

      <button type="submit" class="auth-btn" [disabled]="loading">
        {{ loading ? 'Registrando...' : 'Registrarse' }}
      </button>
    </form>

    <p class="auth-footer">
      ¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión aquí</a>
    </p>
  </div>
</div>
