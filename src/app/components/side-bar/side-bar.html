
<div class="sidebar-overlay" [class.active]="abierto" (click)="toggle()"></div>

<div class="sidebar" [class.open]="abierto">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <i class="bi bi-house-heart-fill"></i>
      <span>HogarApp</span>
    </div>
    <button class="sidebar-close" (click)="toggle()">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <nav class="sidebar-nav">
    <ul class="nav-menu">
      <li (click)="toggle()" routerLink="/"> 
        <i class="bi bi-house"></i> 
        <span>Inicio</span> 
        </li>
      <li (click)="toggle()" routerLink="/settings"> 
        <i class="bi bi-gear"></i> 
        <span>Ajustes</span> 
      </li>
    </ul>
  </nav>

  <div class="sidebar-footer">
    <button class="logout-btn" (click)=" toggle()">
      <i class="bi bi-box-arrow-right"></i>
      <span>Cerrar Sesión</span>
    </button>
  </div>
</div>
