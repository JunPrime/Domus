<!-- header.html - Versión simplificada -->
<header class="app-header">
  <!-- Botón de menú para sidebar -->
  <button class="menu-btn" (click)="openSidebar()">
    <i class="bi bi-list"></i>
  </button>

  <!-- Logo centrado -->
  <div class="logo">
    <i class="bi bi-house-heart-fill"></i>
    <span>Domus</span>
  </div>

  <!-- Cerrar sesión como ícono -->
  <div class="user-menu" *ngIf="isLoggedIn">
    <button class="logout-icon" (click)="cerrarSesion()" title="Cerrar sesión">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>

  <!-- Botones de auth si NO está logueado -->
  <div class="auth-buttons" *ngIf="!isLoggedIn">
    <a routerLink="/login" class="btn-login">Iniciar sesión</a>
    <a routerLink="/register" class="btn-register">Registrarse</a>
  </div>
</header>
